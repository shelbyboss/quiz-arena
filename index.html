<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#201C5A; --surface:#3B3690; --surface-2:#4A44A8; --surface-3:#5F59C0;
    --text:#FFFFFF; --text-dim:#D6D1F8; --text-faint:#ADA7E2;
    --accent:#8E6DFF; --accent-2:#FF6FB1; --ok:#2FD08F; --bad:#EE5248;
    --red:#E4433C; --blue:#2C82E0; --yellow:#F2B705; --green:#26C281;
    --shadow: 0 12px 30px rgba(0,0,0,.35);
    --fw: min(100vw, 760px, 82vh);
    --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Noto Sans Thai','Noto Sans',system-ui,sans-serif;
    background-image:
      radial-gradient(circle at 15% 8%, rgba(170,140,255,.38), transparent 48%),
      radial-gradient(circle at 90% 85%, rgba(255,111,177,.24), transparent 42%);
    background-attachment:fixed;
  }
  h1,h2,h3,.display{ font-family:'Kanit',system-ui,sans-serif; letter-spacing:.2px; }
  button{font-family:inherit;}
  img{max-width:100%;}
  [hidden]{display:none!important;}
  ::selection{background:var(--accent);color:#fff;}
  /* party frame: top and bottom slices keep their proportions, the plain middle stretches to any screen height */
  #bg-frame{
    position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);
    width:var(--fw);pointer-events:none;z-index:0;opacity:.5;
    background-image:url('bg-party-top.png'),url('bg-party-bottom.png'),url('bg-party-mid.png');
    background-repeat:no-repeat,no-repeat,no-repeat;
    background-position:center top,center bottom,center;
    background-size:100% auto,100% auto,100% 100%;
  }
  .app-shell{position:relative;z-index:1;
    max-width:var(--fw); margin:0 auto; min-height:100%;
    display:flex; flex-direction:column;
    padding: calc(env(safe-area-inset-top, 0px) + var(--fw)*0.15) clamp(30px, calc(var(--fw)*0.105), 76px) calc(env(safe-area-inset-bottom, 0px) + var(--fw)*0.38);
    gap:16px;
  }
  .topbar,.hero-sub,.footer-note{text-shadow:0 1px 4px rgba(20,10,80,.85);}
  .hero-title{filter:drop-shadow(0 2px 4px rgba(20,10,80,.8));}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Kanit';font-weight:700;font-size:18px;color:var(--text);}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 12px var(--accent-2);}
  .room-chip{
    font-family:'JetBrains Mono';font-weight:700;letter-spacing:2px;
    background:var(--surface-2);border:1px solid var(--surface-3);
    padding:6px 12px;border-radius:999px;font-size:13px;color:var(--text-dim);
  }
  .exit-btn{
    background:var(--surface-2);border:1px solid var(--surface-3);color:var(--text-dim);
    width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px;
    display:flex;align-items:center;justify-content:center;
  }
  .exit-btn:hover{color:var(--text);border-color:var(--accent);}
  .main{flex:1;display:flex;flex-direction:column;gap:18px;}
  .center-col{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;}
  .card{background:var(--surface);border:1px solid var(--surface-3);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow);}
  .hero-title{font-size:clamp(30px,8vw,42px);font-weight:800;line-height:1.1;text-wrap:balance;}
  .hero-sub{color:var(--text-dim);font-size:15px;line-height:1.6;max-width:46ch;}
  .accent-text{background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .btn{
    appearance:none;border:none;cursor:pointer;border-radius:var(--radius-md);
    padding:16px 20px;font-weight:700;font-size:16px;font-family:'Kanit';
    display:flex;align-items:center;justify-content:center;gap:10px;
    transition:transform .12s ease, filter .12s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:linear-gradient(135deg,var(--accent),#5b3ff0);color:#fff;box-shadow:0 8px 24px rgba(124,92,255,.35);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--surface-3);}
  .btn-secondary:hover{border-color:var(--accent);}
  .btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--surface-3);}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
  .btn-block{width:100%;}
  .btn-lg{padding:20px 22px;font-size:18px;}
  .home-choices{display:grid;gap:14px;}
  .choice-card{
    background:var(--surface);border:1px solid var(--surface-3);border-radius:var(--radius-lg);
    padding:20px;text-align:left;cursor:pointer;display:flex;gap:16px;align-items:center;
    transition:border-color .15s, transform .12s;
  }
  .choice-card:hover{border-color:var(--accent);transform:translateY(-2px);}
  .choice-card .emoji{font-size:30px;}
  .choice-card b{font-family:'Kanit';font-size:17px;display:block;}
  .choice-card span{color:var(--text-dim);font-size:13px;}
  label{font-size:13px;color:var(--text-dim);font-weight:600;display:block;margin-bottom:6px;}
  input[type=text]{
    width:100%;background:rgba(22,18,74,.6);border:1px solid var(--surface-3);color:var(--text);
    border-radius:var(--radius-sm);padding:13px 14px;font-size:16px;font-family:inherit;
  }
  input[type=text]:focus{outline:none;border-color:var(--accent);}
  input.mono-code{font-family:'JetBrains Mono';letter-spacing:6px;text-align:center;font-size:22px;font-weight:700;text-transform:uppercase;}
  .field{margin-bottom:14px;}
  .q-card{background:var(--surface-2);border:1px solid var(--surface-3);border-radius:var(--radius-md);padding:16px;margin-bottom:12px;}
  .q-card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .q-index{font-family:'Kanit';font-weight:700;color:var(--accent-2);font-size:13px;letter-spacing:1px;text-transform:uppercase;}
  .icon-btn{background:transparent;border:none;color:var(--text-faint);cursor:pointer;font-size:15px;padding:4px 8px;}
  .icon-btn:hover{color:var(--bad);}
  .choice-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
  .choice-input-wrap{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--surface-3);border-radius:var(--radius-sm);padding:6px 10px;}
  .choice-input-wrap input[type=text]{background:transparent;border:none;padding:8px 4px;font-size:14px;}
  .choice-input-wrap input[type=text]:focus{border:none;}
  .shape-dot{width:20px;height:20px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;}
  .shape-0{background:var(--red);} .shape-1{background:var(--blue);} .shape-2{background:var(--yellow);} .shape-3{background:var(--green);}
  .correct-radio{width:20px;height:20px;flex:none;accent-color:var(--ok);}
  .timelimit-row{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px;color:var(--text-dim);}
  .timelimit-row input[type=range]{flex:1;accent-color:var(--accent);}
  .sets-box{background:var(--surface-2);border:1px solid var(--surface-3);border-radius:var(--radius-md);padding:12px;margin-bottom:16px;}
  .sets-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .sets-list{display:flex;flex-direction:column;gap:6px;max-height:180px;overflow-y:auto;}
  .set-row{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:var(--radius-sm);padding:8px 10px;}
  .set-name{flex:1;min-width:0;display:flex;flex-direction:column;font-size:14px;}
  .set-name b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .set-name span{font-size:12px;color:var(--text-dim);}
  .mode-toggle{display:flex;gap:6px;margin:10px 0 4px;}
  .mode-btn{flex:1;padding:8px 10px;border-radius:999px;border:1px solid var(--surface-3);background:var(--surface);color:var(--text-dim);font-size:12px;font-weight:600;cursor:pointer;font-family:'Kanit';}
  .mode-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .code-display{
    font-family:'JetBrains Mono';font-size:clamp(42px,14vw,64px);font-weight:700;letter-spacing:10px;
    text-align:center;color:var(--text);background:var(--surface-2);border:2px dashed var(--surface-3);
    border-radius:var(--radius-lg);padding:22px 10px;margin:6px 0;
  }
  .player-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;min-height:44px;}
  .player-chip{
    background:var(--surface-2);border:1px solid var(--surface-3);border-radius:999px;
    padding:8px 14px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;
    animation:pop .25s ease;
  }
  @keyframes pop{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
  .avatar-badge{
    border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;line-height:1;
    position:relative;overflow:hidden;
    box-shadow:0 3px 6px rgba(0,0,0,.35), inset -3px -4px 7px rgba(0,0,0,.28), inset 2px 3px 6px rgba(255,255,255,.5);
    text-shadow:0 1px 1px rgba(0,0,0,.25);
  }
  .avatar-badge::before{
    content:'';position:absolute;top:8%;left:16%;width:55%;height:32%;
    background:rgba(255,255,255,.45);border-radius:50%;filter:blur(1.5px);transform:rotate(-18deg);
  }
  .avatar-picker{margin-bottom:14px;}
  .avatar-preview-row{display:flex;align-items:center;gap:14px;margin-bottom:10px;}
  .color-swatches{display:flex;gap:8px;margin-bottom:10px;}
  .color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex:none;}
  .color-swatch.active{border-color:#fff;}
  .emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-height:160px;overflow-y:auto;}
  .emoji-btn{background:var(--surface-2);border:1px solid var(--surface-3);border-radius:var(--radius-sm);font-size:20px;padding:6px 0;cursor:pointer;}
  .emoji-btn.active{border-color:var(--accent);background:var(--surface-3);}
  .muted{color:var(--text-dim);font-size:14px;}
  .center-text{text-align:center;}
  .qn-tag{font-family:'Kanit';font-weight:700;color:var(--accent-2);font-size:14px;letter-spacing:1px;}
  .question-text{font-family:'Kanit';font-weight:700;font-size:clamp(20px,5.5vw,28px);line-height:1.3;text-wrap:balance;margin:10px 0 16px;}
  body.urgent::after{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:50;
    box-shadow:inset 0 0 90px 10px rgba(255,59,48,.6);
    animation:urgentPulse .45s ease-in-out infinite alternate;
  }
  @keyframes urgentPulse{from{opacity:.2;}to{opacity:1;}}
  body.urgent .timerbar-fill{background:linear-gradient(90deg,#ff3b30,#ff9500);}
  body.urgent .timer-label span:first-child{color:#ff6b5e;font-weight:700;font-size:15px;}
  @media (prefers-reduced-motion: reduce){ body.urgent::after{animation:none;opacity:.6;} }
  .countdown-big{font-family:'JetBrains Mono';font-weight:700;font-size:clamp(44px,14vw,72px);letter-spacing:3px;text-align:center;margin:6px 0;background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .q-image{width:100%;max-height:280px;object-fit:contain;border-radius:var(--radius-md);margin:8px 0;display:block;background:var(--surface-2);transition:filter .3s linear;}
  .q-image-wrap{position:relative;width:100%;height:280px;border-radius:var(--radius-md);margin:8px 0;background:var(--surface-2);overflow:hidden;}
  .q-image-wrap .q-image{margin:0;max-height:none;height:100%;border-radius:0;}
  .reveal-grid{position:absolute;inset:0;display:grid;}
  .reveal-tile{background:var(--surface-2);transition:opacity .35s ease;}
  .reveal-tile.revealed{opacity:0;}
  .img-url-field{margin-top:10px;}
  .img-preview-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .img-thumb{width:64px;height:64px;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--surface-3);flex:none;}
  .upload-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .upload-row input[type=file]{color:var(--text-dim);font-size:12px;max-width:100%;}
  .upload-status{font-size:12px;color:var(--accent-2);}
  .timerbar{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-bottom:6px;}
  .timerbar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));width:100%;}
  .timer-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-bottom:14px;}
  .answers-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .answer-tile{
    border:none;border-radius:var(--radius-md);padding:22px 14px;min-height:96px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    color:#fff;font-family:'Kanit';font-weight:700;font-size:15px;cursor:pointer;text-align:center;
    transition:transform .12s, filter .12s, opacity .15s;
  }
  .answer-tile .shape{font-size:26px;line-height:1;}
  .answer-tile:active{transform:scale(.96);}
  .answer-tile:disabled{cursor:default;}
  .at-0{background:linear-gradient(160deg,var(--red),#b8241e);}
  .at-1{background:linear-gradient(160deg,var(--blue),#1c5aa0);}
  .at-2{background:linear-gradient(160deg,var(--yellow),#c08e00);}
  .at-3{background:linear-gradient(160deg,var(--green),#0f8f5f);}
  .answer-tile.dim{opacity:.35;}
  .answer-tile.picked{outline:3px solid #fff;}
  .bars{display:flex;flex-direction:column;gap:10px;margin:14px 0;}
  .bar-row{display:flex;align-items:center;gap:10px;}
  .bar-shape{width:26px;height:26px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;}
  .bar-track{flex:1;height:26px;background:var(--surface-2);border-radius:8px;overflow:hidden;position:relative;}
  .bar-fill{height:100%;border-radius:8px;transition:width .5s ease;}
  .bar-count{width:28px;text-align:right;font-family:'JetBrains Mono';font-size:13px;color:var(--text-dim);}
  .bar-row.is-correct .bar-track{box-shadow:0 0 0 2px var(--ok) inset;}
  .feedback-badge{text-align:center;padding:26px 16px;border-radius:var(--radius-lg);margin-bottom:16px;}
  .feedback-badge.good{background:linear-gradient(135deg,rgba(38,194,129,.22),rgba(38,194,129,.06));border:1px solid rgba(38,194,129,.4);}
  .feedback-badge.bad{background:linear-gradient(135deg,rgba(228,67,60,.22),rgba(228,67,60,.06));border:1px solid rgba(228,67,60,.4);}
  .feedback-badge .big{font-family:'Kanit';font-weight:800;font-size:26px;}
  .feedback-badge .pts{font-family:'JetBrains Mono';font-size:15px;color:var(--text-dim);margin-top:4px;}
  .lb-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius-sm);background:var(--surface-2);margin-bottom:8px;}
  .lb-row.me{border:1.5px solid var(--accent);}
  .lb-rank{font-family:'JetBrains Mono';font-weight:700;color:var(--accent-2);width:26px;}
  .lb-name{flex:1;font-weight:600;}
  .lb-score{font-family:'JetBrains Mono';font-weight:700;}
  .podium{display:flex;align-items:flex-end;gap:10px;justify-content:center;margin:20px 0 10px;}
  .podium-col{flex:1;max-width:140px;text-align:center;}
  .podium-block{border-radius:12px 12px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:10px;font-family:'JetBrains Mono';font-weight:700;color:#fff;}
  .podium-1 .podium-block{height:120px;background:linear-gradient(160deg,#F2B705,#a87c00);}
  .podium-2 .podium-block{height:90px;background:linear-gradient(160deg,#9AA5C7,#5d6689);}
  .podium-3 .podium-block{height:70px;background:linear-gradient(160deg,#C97A4A,#7a4a2b);}
  .podium-col .avatar-badge{margin-bottom:8px;}
  .podium-name{font-weight:700;font-size:13px;margin-top:8px;}
  .podium-score{font-family:'JetBrains Mono';font-size:12px;color:var(--text-dim);}
  .warn-banner{background:rgba(242,183,5,.15);border:1px solid rgba(242,183,5,.4);color:#F2B705;padding:12px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:14px;}
  .err-banner{background:rgba(228,67,60,.15);border:1px solid rgba(228,67,60,.4);color:#ff8b85;padding:12px 14px;border-radius:var(--radius-sm);font-size:13px;margin-bottom:14px;}
  .footer-note{text-align:center;color:var(--text-faint);font-size:12px;margin-top:auto;padding-top:10px;}
  a{color:var(--accent-2);}
</style>
</head>
<body>
<div id="bg-frame" aria-hidden="true"></div>
<div class="app-shell">
  <div class="topbar" id="topbar"></div>
  <div class="main" id="app"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="firebase-config.js"></script>

<script>
(function(){
  "use strict";

  // ---------- helpers ----------
  function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

  function getPlayerId(){
    let id = lsGet('qa_pid', null);
    if(!id){
      id = 'p_' + (crypto.randomUUID ? crypto.randomUUID().replace(/-/g,'') : (Math.random().toString(36).slice(2)+Date.now().toString(36)));
      lsSet('qa_pid', id);
    }
    return id;
  }

  // ---------- sound (synthesized with Web Audio, no audio files) ----------
  let AC = null;
  let muted = lsGet('qa_muted','0')==='1';
  function audioCtx(){
    try{
      if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
      if(AC.state==='suspended') AC.resume();
    }catch(e){ AC=null; }
    return AC;
  }
  function tone(freq, start, dur, type, vol){
    if(muted) return;
    const a = audioCtx(); if(!a) return;
    const t = a.currentTime + start;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type||'sine';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol||0.2, t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t+dur+0.03);
  }
  const SFX = {
    join(){ tone(660,0,.12,'sine',.2); tone(880,.1,.12,'sine',.2); tone(1320,.2,.2,'sine',.2); },
    start(){
      [262,330,392,523,659,784].forEach((f,i)=>tone(f,i*.055,.14,'sawtooth',.1));
      tone(1047,.36,.4,'triangle',.22); tone(523,.36,.4,'square',.08);
    },
    tick(){ tone(900,0,.06,'square',.07); },
    tickFinal(){ tone(1300,0,.09,'square',.12); tone(650,0,.09,'triangle',.1); },
    // last-5-seconds alarm: more beeps per second and higher pitch as time runs out
    urgent(secs){
      const beeps = secs<=1 ? 4 : secs<=2 ? 3 : secs<=3 ? 2 : 1;
      const base = 1100 + (5-secs)*170;
      for(let i=0;i<beeps;i++){
        tone(base, i*(1/beeps), 0.09, 'square', 0.17);
        tone(base/2, i*(1/beeps), 0.09, 'sawtooth', 0.08);
      }
      if(AC && !muted){ mKick(AC.currentTime); }
      try{ if(navigator.vibrate) navigator.vibrate(secs<=2 ? [70,40,70] : 60); }catch(e){}
    },
    timeUp(){
      tone(110,0,.5,'sawtooth',.3); tone(55,0,.7,'sine',.4);
      tone(1800,0,.25,'square',.12); tone(900,.05,.25,'square',.1); tone(450,.1,.3,'square',.1);
      if(AC && !muted) mNoise(AC.currentTime, .35, .5, 600);
    },
    click(){ tone(520,0,.06,'triangle',.22); tone(780,.04,.08,'triangle',.18); },
    reveal(){ tone(330,0,.1,'sawtooth',.1); tone(440,.09,.1,'sawtooth',.1); tone(587,.18,.28,'triangle',.24); },
    correct(){

  // ---------- background music: synthesized step sequencer ----------
  const MUSIC = { timer:null, step:0, nextTime:0, mode:null, bpm:132, noise:null, urgent:false, riser:null };
  // rising siren sweep for the final seconds
  function startRiser(durSec){
    if(muted || MUSIC.riser) return;
    const a = audioCtx(); if(!a) return;
    const t = a.currentTime;
    const o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(180, t);
    o.frequency.exponentialRampToValueAtTime(1400, t+durSec);
    f.type = 'lowpass';
    f.frequency.setValueAtTime(500, t);
    f.frequency.exponentialRampToValueAtTime(5000, t+durSec);
    g.gain.setValueAtTime(0.02, t);
    g.gain.linearRampToValueAtTime(0.11, t+durSec);
    o.connect(f); f.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t+durSec+0.1);
    MUSIC.riser = { o, g };
  }
  function stopRiser(){
    const r = MUSIC.riser; MUSIC.riser = null;
    if(!r || !AC) return;
    try{
      r.g.gain.cancelScheduledValues(AC.currentTime);
      r.g.gain.setValueAtTime(r.g.gain.value, AC.currentTime);
      r.g.gain.linearRampToValueAtTime(0.0001, AC.currentTime+0.05);
      r.o.stop(AC.currentTime+0.08);
    }catch(e){}
  }
  const CHORDS = [
    { root:110.0,  arp:[440,523.25,659.25] },
    { root:110.0,  arp:[440,523.25,659.25] },
    { root:87.31,  arp:[349.23,440,523.25] },
    { root:98.0,   arp:[392,493.88,587.33] }
  ];
  function noiseBuffer(a){
    if(!MUSIC.noise){
      const b = a.createBuffer(1, Math.floor(a.sampleRate*0.3), a.sampleRate);
      const d = b.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
      MUSIC.noise = b;
    }
    return MUSIC.noise;
  }
  function mTone(freq, t, dur, type, vol){
    const a = AC;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t+dur+0.02);
  }
  function mKick(t){
    const a = AC, o = a.createOscillator(), g = a.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(42, t+0.12);
    g.gain.setValueAtTime(0.55, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.2);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t+0.22);
  }
  function mNoise(t, dur, vol, hpFreq){
    const a = AC, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = noiseBuffer(a);
    f.type = 'highpass'; f.frequency.value = hpFreq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    s.connect(f); f.connect(g); g.connect(a.destination);
    s.start(t); s.stop(t+dur+0.02);
  }
  // crowd applause: many short band-passed noise bursts, dense in the middle, fading out
  function applause(durSec){
    if(muted) return;
    const a = audioCtx(); if(!a) return;
    const t0 = a.currentTime + 0.05;
    const comp = a.createDynamicsCompressor();
    const master = a.createGain();
    master.gain.setValueAtTime(1.0, t0);
    master.gain.setValueAtTime(1.0, t0 + durSec*0.7);
    master.gain.linearRampToValueAtTime(0.0001, t0 + durSec);
    comp.connect(master); master.connect(a.destination);
    const buf = noiseBuffer(a);
    const claps = Math.round(durSec*75);
    for(let i=0;i<claps;i++){
      const x = Math.random();
      const when = t0 + durSec*Math.pow(x, 1.3)*0.97;
      const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
      s.buffer = buf;
      f.type = 'bandpass';
      f.frequency.value = 1100 + Math.random()*2600;
      f.Q.value = 0.7 + Math.random()*0.8;
      const swell = 0.35 + 0.65*Math.min(1, (when-t0)/(durSec*0.35));
      const vol = (0.35 + Math.random()*0.55) * swell;
      g.gain.setValueAtTime(0.0001, when);
      g.gain.exponentialRampToValueAtTime(vol, when+0.003);
      g.gain.exponentialRampToValueAtTime(0.0001, when+0.04+Math.random()*0.04);
      s.connect(f); f.connect(g); g.connect(comp);
      s.start(when, Math.random()*0.2, 0.12);
    }
    // a few cheering "whoo" glides on top
    [0.15, 0.5, 0.85].forEach((p,i)=>{
      const o = a.createOscillator(), og = a.createGain(), of = a.createBiquadFilter();
      const w = t0 + durSec*p*0.8;
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(380 + i*70, w);
      o.frequency.exponentialRampToValueAtTime(760 + i*90, w+0.35);
      of.type = 'bandpass'; of.frequency.value = 1100; of.Q.value = 1.2;
      og.gain.setValueAtTime(0.0001, w);
      og.gain.exponentialRampToValueAtTime(0.09, w+0.06);
      og.gain.exponentialRampToValueAtTime(0.0001, w+0.45);
      o.connect(of); of.connect(og); og.connect(comp);
      o.start(w); o.stop(w+0.5);
    });
  }

  function scheduleStep(step, t){
    const chord = CHORDS[Math.floor(step/8)%4];
    const stepDur = 60/MUSIC.bpm/4;
    if(MUSIC.mode==='question'){
      const u = MUSIC.urgent;
      if(u ? step%2===0 : step%4===0) mKick(t);
      if(u ? true : step%4===2) mNoise(t, 0.04, u ? 0.16 : 0.12, 7000);
      if(step%8===4 || (u && step%4===2)) mNoise(t, 0.12, 0.34, 1800);
      if(step%2===0) mTone(chord.root*(u?2:1), t, stepDur*1.6, 'sawtooth', u ? 0.12 : 0.09);
      const arpNote = chord.arp[[0,1,2,1][step%4]] * ((u || step%16>=8) ? 2 : 1);
      mTone(arpNote, t, stepDur*0.9, 'square', u ? 0.05 : 0.03);
    } else if(MUSIC.mode==='lobby'){
      if(step%8===0) mTone(chord.root*2, t, stepDur*3, 'triangle', 0.08);
      if(step%2===0) mTone(chord.arp[[0,1,2,1][(step/2)%4]], t, stepDur*1.8, 'triangle', 0.04);
      if(step%8===4) mNoise(t, 0.04, 0.05, 8000);
    }
  }
  function musicTick(){
    const a = AC;
    if(!a || muted || !MUSIC.mode) return;
    while(MUSIC.nextTime < a.currentTime + 0.15){
      scheduleStep(MUSIC.step, MUSIC.nextTime);
      MUSIC.nextTime += 60/MUSIC.bpm/4;
      MUSIC.step = (MUSIC.step+1)%32;
    }
  }
  function applyMusic(){
    if(MUSIC.timer){ clearInterval(MUSIC.timer); MUSIC.timer = null; }
    if(!MUSIC.mode || muted) return;
    const a = audioCtx(); if(!a) return;
    MUSIC.step = 0; MUSIC.nextTime = a.currentTime + 0.05;
    MUSIC.timer = setInterval(musicTick, 25);
  }
  function setMusic(mode){
    if(MUSIC.mode===mode) return;
    MUSIC.mode = mode;
    MUSIC.bpm = mode==='question' ? 132 : 100;
    MUSIC.urgent = false;
    if(mode!=='question'){ stopRiser(); document.body.classList.remove('urgent'); }
    applyMusic();
  }

  // Builds the image DOM ONCE (per real render); applyImageReveal() then updates it live
  // on each timer tick without touching the rest of the screen, so nothing flickers/reloads.
  function buildQuestionImage(q){
    if(!q || !q.imageUrl || !q.imageUrl.trim()) return null;
    const mode = q.revealMode || 'blur';
    const img = el('<img class="q-image" src="'+esc(q.imageUrl.trim())+'" alt="" loading="lazy">');

      const tileEls = [];
      for(let i=0;i<REVEAL_TOTAL;i++){
        const tile = el('<div class="reveal-tile"></div>');
        tileEls.push(tile);
        grid.appendChild(tile);
      }
      wrap.appendChild(grid);
      return { el:wrap, mode, img, tileEls };
    }

    return { el:img, mode, img };
  }

  function applyImageReveal(ref, revealFrac){
    if(!ref) return;
    const revealing = revealFrac!==undefined && revealFrac<1;
    if(ref.mode==='tiles'){
      if(!revealing){ ref.tileEls.forEach(t=>t.classList.add('revealed')); return; }
      const revealCount = Math.max(0, Math.floor(revealFrac * REVEAL_TOTAL));
      const revealedSet = new Set(REVEAL_ORDER.slice(0, revealCount));
      ref.tileEls.forEach((t,i)=>{ t.classList.toggle('revealed', revealedSet.has(i)); });
    } else if(ref.mode==='blur'){
      if(!revealing){ ref.img.style.filter=''; return; }
      const blurPx = Math.round((1-revealFrac) * 18);
      ref.img.style.filter = blurPx>0 ? 'blur('+blurPx+'px)' : '';
    }
  }

  // Lightweight per-tick updater (250ms) — updates only the timer bar, countdown
  // text, and image reveal in place, instead of rebuilding the whole screen.
  function updateTick(){
    const t = S.tickTargets;
    if(!t) return;
    if(t.kind==='question'){
      const {pct, secsLeft} = timerFillStyle(t.q, t.startedAt);
      if(t.timerFill) t.timerFill.style.width = pct+'%';
      if(t.secsLabel) t.secsLabel.textContent = '⏱ เหลือ '+secsLeft+' วิ';
      if(t.imgRef) applyImageReveal(t.imgRef, 1-pct/100);
      const tickKey = S.code+':'+(S.game?S.game.currentIndex:'')+':'+secsLeft;
      const urgent = secsLeft>0 && secsLeft<=5;
      MUSIC.urgent = urgent;
      if(MUSIC.mode==='question'){
        MUSIC.bpm = !urgent ? 132 : ({5:148,4:158,3:170,2:185,1:200})[secsLeft];
      }
      document.body.classList.toggle('urgent', urgent);
      if(urgent){
        const riserKey = S.code+':'+(S.game?S.game.currentIndex:'');
        if(S.riserKey!==riserKey){
          S.riserKey = riserKey;
          startRiser(Math.max(0.5, pct/100*(t.q.timeLimitSec||20)));
        }
      }
      if(urgent && S.lastTickKey!==tickKey){
        S.lastTickKey = tickKey;
        SFX.urgent(secsLeft);
      }
    } else if(t.kind==='lobby'){
      const remain = t.target - Date.now();
      if(t.countEl) t.countEl.textContent = remain>0 ? fmtCountdown(remain) : '00:00';
      if(t.hintEl && remain<=0) t.hintEl.textContent = 'กำลังเริ่มเกม...';
      const secs = Math.ceil(remain/1000);
      const key = 'lobby:'+secs;
      if(secs>0 && secs<=5 && S.lastTickKey!==key){ S.lastTickKey = key; SFX.tickFinal(); }
      if(remain<=0 && S.isHost) startGame();
    } else if(t.kind==='reveal'){
      const remain = Math.max(0, 5000 - (Date.now()-(t.startedAt||Date.now())));
      if(t.countEl) t.countEl.textContent = ' ('+Math.ceil(remain/1000)+')';
    }
  }

  function fileToCompressedDataUrl(file, maxDim, quality){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onerror = ()=>reject(new Error('read_failed'));
      reader.onload = (e)=>{
        const img = new Image();
        img.onerror = ()=>reject(new Error('decode_failed'));
        img.onload = ()=>{
          let w=img.width, h=img.height;
          if(w>maxDim || h>maxDim){ const scale=Math.min(maxDim/w, maxDim/h); w=Math.round(w*scale); h=Math.round(h*scale); }
          const canvas = document.createElement('canvas');
          canvas.width=w; canvas.height=h;
          canvas.getContext('2d').drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function findInvalidQuestion(){
    for(let i=0;i<S.questions.length;i++){
      const q = S.questions[i];
      if(!q.text.trim()) return i;
      const n = q.mode==='two' ? 2 : 4;
      for(let ci=0; ci<n; ci++){ if(!q.choices[ci].trim()) return i; }
    }
    return -1;
  }

  async function createRoom(){
    const badIndex = findInvalidQuestion();
    if(badIndex>=0){ alert('กรุณากรอกคำถามข้อที่ '+(badIndex+1)+' ให้ครบ (ทั้งข้อความคำถาม และตัวเลือกทั้ง 4 ช่อง) ก่อนสร้างห้อง'); return; }
    if(!S.db){ alert('ยังเชื่อมต่อฐานข้อมูลไม่ได้ ลองใหม่อีกครั้ง'); return; }
    saveTemplate();
    let code=null;
    for(let tries=0; tries<6; tries++){
      const candidate = genCode(5);
      const snap = await S.db.doc('games/'+candidate).get();
      if(!snap.exists){ code=candidate; break; }
    }
    if(!code){ alert('สร้างห้องไม่สำเร็จ ลองอีกครั้ง'); return; }
    const gameData = {
      title: S.quizTitle || 'ควิซไม่มีชื่อ',
      status:'lobby', currentIndex:0, questionStartedAt:null, revealStartedAt:null, autoAdvance:!!S.autoAdvance,
      questions: S.questions.map(q=>({ text:q.text, choices: q.mode==='two' ? q.choices.slice(0,2) : q.choices, correctIndex:q.correctIndex, timeLimitSec:q.timeLimitSec, imageUrl:(q.imageUrl||'').trim(), revealMode:q.revealMode||'blur' })),
      createdAt: Date.now(),
    };
    await S.db.doc('games/'+code).set(gameData);
    S.code=code; S.isHost=true; S.game=gameData;
    history.replaceState(null,'','?room='+code);
    subscribeToGame(code);
    S.screen='host-play'; render();
  }

  // ================= SUBSCRIPTIONS (shared host/player) =================
  function subscribeToGame(code){
    clearSubs();
    const uGame = S.db.doc('games/'+code).onSnapshot(snap=>{
      if(!snap.exists){ S.game=null; render(); return; }
      S.game = snap.data();
      onGameChanged();
      render();
    }, err=>{ console.error(err); });
    const uPlayers = S.db.collection('games/'+code+'/players').onSnapshot(qs=>{
      const prevCount = S.playersDocs.length;
      S.playersDocs = qs.docs.map(d=>({ id:d.id, ...d.data() }));
      if(S.isHost && S.game && S.game.status==='lobby' && S.playersDocs.length>prevCount) SFX.join();
      render();
    }, err=>{ console.error(err); });
    const uAnswers = S.db.collection('games/'+code+'/answers').onSnapshot(qs=>{
      S.answersDocs = qs.docs.map(d=>({ id:d.id, ...d.data() }));
      S.myLastAnswer = S.answersDocs.find(a=> a.playerId===S.playerId && a.qIndex===(S.game?S.game.currentIndex:-1)) || null;
      render();
    }, err=>{ console.error(err); });
    S.subs.push(uGame, uPlayers, uAnswers);
  }

  function onGameChanged(){
    if(!S.game) return;
    S.myLastAnswer = S.answersDocs.find(a=> a.playerId===S.playerId && a.qIndex===S.game.currentIndex) || null;
    setMusic(S.game.status==='question' ? 'question' : (S.game.status==='lobby' ? 'lobby' : null));
    const soundKey = S.game.status+':'+S.game.currentIndex;
    if(S.lastSoundKey!==soundKey){
      const first = S.lastSoundKey===undefined;
      S.lastSoundKey = soundKey;
      if(!first || S.game.status!=='lobby'){
        if(S.game.status==='question') SFX.start();
        else if(S.game.status==='reveal'){
          SFX.timeUp();
          const outcome = S.isHost ? SFX.reveal : (S.myLastAnswer && S.myLastAnswer.correct ? SFX.correct : SFX.wrong);
          setTimeout(outcome, 450);
        }
        else if(S.game.status==='ended') SFX.end();
      }
    }
    if(S.isHost){
      if(S.game.status==='question'){
        if(S.questionTimer) clearTimeout(S.questionTimer);
        const q = S.game.questions[S.game.currentIndex];
        const limitMs = (q.timeLimitSec||20)*1000;
        const remaining = limitMs - (Date.now() - (S.game.questionStartedAt||Date.now()));
        S.questionTimer = setTimeout(()=>{ revealCurrent(); }, Math.max(300, remaining+250));
      } else if(S.game.status==='reveal' && S.game.autoAdvance){
        if(S.questionTimer) clearTimeout(S.questionTimer);
        const remaining = 5000 - (Date.now() - (S.game.revealStartedAt||Date.now()));
        S.questionTimer = setTimeout(()=>{ nextQuestion(); }, Math.max(300, remaining+250));
      } else if(S.questionTimer){
        clearTimeout(S.questionTimer); S.questionTimer=null;
      }
    }
    if(S.tickTimer){ clearInterval(S.tickTimer); S.tickTimer=null; }
    if(S.game.status==='question' || (S.game.status==='reveal' && S.game.autoAdvance) || (S.game.status==='lobby' && S.game.scheduledStartAt)){
      S.tickTimer = setInterval(updateTick, 250);
    }
  }

  // ================= HOST controls =================
  async function startGame(){
    if(!S.game || S.game.status!=='lobby' || S.starting) return;
    S.starting = true;
    try{
      await S.db.doc('games/'+S.code).update({ status:'question', currentIndex:0, questionStartedAt:Date.now(), scheduledStartAt:null });
    } finally { S.starting = false; }
  }
  async function setSchedule(mins){
    mins = Math.floor(Number(mins));
    if(!(mins>=1)) { alert('ใส่จำนวนนาทีตั้งแต่ 1 ขึ้นไป'); return; }
    mins = Math.min(mins, 720);
    await S.db.doc('games/'+S.code).update({ scheduledStartAt: Date.now() + mins*60000 });
  }
  async function cancelSchedule(){
    await S.db.doc('games/'+S.code).update({ scheduledStartAt: null });
  }
  function fmtCountdown(ms){
    const total = Math.max(0, Math.ceil(ms/1000));
    const h = Math.floor(total/3600), m = Math.floor((total%3600)/60), s = total%60;
    const pad = n=>String(n).padStart(2,'0');
    return h>0 ? h+':'+pad(m)+':'+pad(s) : pad(m)+':'+pad(s);
  }
  async function revealCurrent(){
    if(!S.game || S.game.status!=='question') return;
    await S.db.doc('games/'+S.code).update({ status:'reveal', revealStartedAt:Date.now() });
  }
  async function nextQuestion(){
    const nextIdx = S.game.currentIndex+1;
    if(nextIdx >= S.game.questions.length){
      await S.db.doc('games/'+S.code).update({ status:'ended' });
    } else {
      await S.db.doc('games/'+S.code).update({ status:'question', currentIndex:nextIdx, questionStartedAt:Date.now() });
    }
  }

  async function doJoin(){
    const code = S.joinCodeInput.trim();
    const name = S.joinNameInput.trim();
    if(!code || !name){ S.joinError='กรุณากรอกรหัสห้องและชื่อให้ครบ'; render(); return; }
    if(!S.db){ S.joinError='เชื่อมต่อฐานข้อมูลไม่ได้'; render(); return; }
    const snap = await S.db.doc('games/'+code).get();
    if(!snap.exists){ S.joinError='ไม่พบห้องนี้ ตรวจสอบรหัสอีกครั้ง'; render(); return; }
    const data = snap.data();
    if(data.status !== 'lobby'){ S.joinError='ห้องนี้เริ่มเล่นไปแล้ว ขอรหัสห้องใหม่จากเจ้าของเกม'; render(); return; }
    lsSet('qa_name', name);
    S.playerName = name; S.code=code; S.isHost=false; S.joinError='';
    await S.db.doc('games/'+code+'/players/'+S.playerId).set({ name, joinedAt:Date.now(), avatarEmoji:S.avatarEmoji, avatarColor:S.avatarColor });
    S.game = data;
    history.replaceState(null,'','?room='+code);
    subscribeToGame(code);
    S.screen='player-play'; render();
  }

  async function submitAnswer(ci){
    if(!S.game || S.game.status!=='question' || S.myLastAnswer) return;
    const idx = S.game.currentIndex;
    const q = S.game.questions[idx];
    const now = Date.now();
    const limitMs = (q.timeLimitSec||20)*1000;
    const elapsed = now - (S.game.questionStartedAt||now);
    const correct = ci === q.correctIndex;
    const frac = Math.max(0, Math.min(1, 1 - elapsed/limitMs));
    const points = correct ? Math.round(500 + 500*frac) : 0;
    S.myLastAnswer = { qIndex:idx, playerId:S.playerId, choiceIndex:ci, correct, points, answeredAtMs:now };
    SFX.click();
    render();
    await S.db.doc('games/'+S.code+'/answers/'+idx+'_'+S.playerId).set(S.myLastAnswer);
  }

  function timerFillStyle(q, startedAt){
    const limitMs=(q.timeLimitSec||20)*1000;
    const remain = Math.max(0, limitMs - (Date.now()-(startedAt||Date.now())));
    const pct = Math.max(0, Math.min(100, remain/limitMs*100));
    return { pct, secsLeft: Math.ceil(remain/1000) };
  }

      const card = el('<div class="card"></div>');
      card.appendChild(el('<h2 style="margin:0 0 10px;">'+esc(g.title)+'</h2>'));
      card.appendChild(el('<p class="muted" style="margin:0 0 4px;">บอกรหัสนี้หรือส่งลิงก์ให้ผู้เล่น</p>'));
      card.appendChild(el('<div class="code-display">'+esc(S.code)+'</div>'));
      const linkRow = el('<div class="muted" style="word-break:break-all;font-size:12px;text-align:center;">'+esc(location.origin+location.pathname+'?room='+S.code)+'</div>');
      card.appendChild(linkRow);
      const rows = scoreboard();
      card.appendChild(el('<p class="muted" style="margin-top:14px;">ผู้เล่นเข้าร่วมแล้ว '+rows.length+' คน</p>'));
      const grid = el('<div class="player-grid"></div>');
      if(rows.length===0){ grid.appendChild(el('<span class="muted">ยังไม่มีใครเข้าร่วม...</span>')); }
      rows.forEach(r=>{
        const chip = el('<div class="player-chip"></div>');
        chip.appendChild(avatarBadgeEl(r, 22));
        chip.appendChild(el('<span>'+esc(r.name)+'</span>'));
        grid.appendChild(chip);
      });
      card.appendChild(grid);
      app.appendChild(card);

      const schedCard = el('<div class="card" style="margin-top:14px;"></div>');
      if(g.scheduledStartAt){
        schedCard.appendChild(el('<p class="muted center-text" style="margin:0;">เกมจะเริ่มอัตโนมัติใน</p>'));
        const countEl = el('<div class="countdown-big"></div>');
        schedCard.appendChild(countEl);
        const hintEl = el('<p class="muted center-text" style="margin:0 0 10px;">ครบเวลาแล้วเกมเริ่มเอง (เปิดหน้านี้ค้างไว้)</p>');
        schedCard.appendChild(hintEl);
        const cancelBtn = el('<button class="btn btn-ghost btn-block">ยกเลิกการตั้งเวลา</button>');
        cancelBtn.addEventListener('click', cancelSchedule);
        schedCard.appendChild(cancelBtn);
        S.tickTargets = { kind:'lobby', countEl, hintEl, target:g.scheduledStartAt };
        updateTick();
      } else {
        schedCard.appendChild(el('<label>ตั้งเวลาเริ่มเกมอัตโนมัติ (อีกกี่นาที)</label>'));
        const quick = el('<div class="mode-toggle" style="margin:0 0 10px;"></div>');
        [1,5,10,15,30].forEach(m=>{
          const b = el('<button type="button" class="mode-btn">'+m+'</button>');
          b.addEventListener('click', ()=>setSchedule(m));
          quick.appendChild(b);
        });
        schedCard.appendChild(quick);
        const customRow = el('<div style="display:flex;gap:8px;"></div>');
        const minInput = document.createElement('input');
        minInput.type='text'; minInput.inputMode='numeric'; minInput.placeholder='กำหนดเอง (นาที)';
        minInput.value = S.schedInput || '';
        minInput.addEventListener('input', ()=>{ S.schedInput = minInput.value; });
        const setBtn = el('<button type="button" class="btn btn-secondary" style="padding:10px 16px;">ตั้งเวลา</button>');
        setBtn.addEventListener('click', ()=>setSchedule(minInput.value));
        customRow.appendChild(minInput); customRow.appendChild(setBtn);
        schedCard.appendChild(customRow);
      }
      app.appendChild(schedCard);

      const startBtn = el('<button class="btn btn-primary btn-block btn-lg" style="margin-top:16px;">🚀 เริ่มเกม</button>');
      startBtn.addEventListener('click', startGame);
      app.appendChild(startBtn);
    }

    else if(g.status==='question'){
      const q = g.questions[g.currentIndex];
      const {pct, secsLeft} = timerFillStyle(q, g.questionStartedAt);
      const card = el('<div class="card"></div>');
      card.appendChild(el('<div class="qn-tag">คำถามที่ '+(g.currentIndex+1)+' / '+g.questions.length+'</div>'));
      const imgRef = buildQuestionImage(q);
      if(imgRef){ applyImageReveal(imgRef, 1-pct/100); card.appendChild(imgRef.el); }
      card.appendChild(el('<div class="question-text">'+esc(q.text)+'</div>'));
      const timerFillEl = el('<div class="timerbar-fill" style="width:'+pct+'%;"></div>');
      const timerBarEl = el('<div class="timerbar"></div>'); timerBarEl.appendChild(timerFillEl);
      card.appendChild(timerBarEl);
      const secsLabelEl = el('<span>⏱ เหลือ '+secsLeft+' วิ</span>');
      const answeredLabelEl = el('<span>ตอบแล้ว '+S.answersDocs.filter(a=>a.qIndex===g.currentIndex).length+'/'+S.playersDocs.length+' คน</span>');
      const timerLabelEl = el('<div class="timer-label"></div>'); timerLabelEl.appendChild(secsLabelEl); timerLabelEl.appendChild(answeredLabelEl);
      card.appendChild(timerLabelEl);
      const grid = el('<div class="answers-grid"></div>');
      q.choices.forEach((c,ci)=>{ grid.appendChild(el('<div class="answer-tile at-'+ci+'"><div class="shape">'+SHAPES[ci]+'</div><div>'+esc(c)+'</div></div>')); });
      card.appendChild(grid);
      app.appendChild(card);
      const revealBtn = el('<button class="btn btn-secondary btn-block" style="margin-top:14px;">ดูผลลัพธ์ตอนนี้ →</button>');
      revealBtn.addEventListener('click', revealCurrent);
      app.appendChild(revealBtn);
      S.tickTargets = { kind:'question', timerFill:timerFillEl, secsLabel:secsLabelEl, imgRef, q, startedAt:g.questionStartedAt };
    }

    else if(g.status==='reveal'){
      const q = g.questions[g.currentIndex];
      const answersForQ = S.answersDocs.filter(a=>a.qIndex===g.currentIndex);
      const card = el('<div class="card"></div>');
      card.appendChild(el('<div class="qn-tag">ผลคำถามที่ '+(g.currentIndex+1)+'</div>'));
      const imgRefReveal = buildQuestionImage(q);
      if(imgRefReveal){ applyImageReveal(imgRefReveal, undefined); card.appendChild(imgRefReveal.el); }
      card.appendChild(el('<div class="question-text">'+esc(q.text)+'</div>'));
      const bars = el('<div class="bars"></div>');
      const total = answersForQ.length||1;
      q.choices.forEach((c,ci)=>{
        const count = answersForQ.filter(a=>a.choiceIndex===ci).length;
        const pct = Math.round(count/total*100);
        const isCorrect = ci===q.correctIndex;
        const row = el('<div class="bar-row'+(isCorrect?' is-correct':'')+'"></div>');
        row.appendChild(el('<div class="bar-shape shape-'+ci+'">'+SHAPES[ci]+'</div>'));
        const track = el('<div class="bar-track"></div>');
        track.appendChild(el('<div class="bar-fill shape-'+ci+'" style="width:'+pct+'%;"></div>'));
        row.appendChild(track);
        row.appendChild(el('<div class="bar-count">'+count+'</div>'));
        bars.appendChild(row);
      });
      card.appendChild(bars);
      card.appendChild(el('<p class="muted">✅ คำตอบที่ถูกคือ: <b style="color:var(--ok);">'+esc(q.choices[q.correctIndex])+'</b></p>'));
      app.appendChild(card);

      const lbCard = el('<div class="card"></div>');
      lbCard.appendChild(el('<h3 style="margin:0 0 10px;">อันดับคะแนน</h3>'));
      const rows = scoreboard();
      rows.slice(0,8).forEach((r,i)=>{
        const row = el('<div class="lb-row"></div>');
        row.appendChild(el('<div class="lb-rank">#'+(i+1)+'</div>'));
        row.appendChild(avatarBadgeEl(r, 28));
        row.appendChild(el('<div class="lb-name">'+esc(r.name)+'</div>'));
        row.appendChild(el('<div class="lb-score">'+r.score+'</div>'));
        lbCard.appendChild(row);
      });
      app.appendChild(lbCard);

      const isLast = g.currentIndex+1>=g.questions.length;
      const nextBtn = el('<button class="btn btn-primary btn-block btn-lg" style="margin-top:14px;"></button>');
      nextBtn.appendChild(document.createTextNode(isLast?'🏁 จบเกม ดูผลสรุป':'คำถามต่อไป →'));
      nextBtn.addEventListener('click', nextQuestion);
      app.appendChild(nextBtn);
      if(g.autoAdvance){
        const countEl = el('<span></span>');
        nextBtn.appendChild(countEl);
        S.tickTargets = { kind:'reveal', countEl, startedAt:g.revealStartedAt };
        updateTick();
      }
    }

    else if(g.status==='ended'){ app.appendChild(renderEndedBlock()); }
    renderTopbar();
  }

  function renderPlayerPlay(){
    const app = document.getElementById('app'); app.innerHTML='';
    if(!S.game){ app.appendChild(el('<div class="card center-text muted">กำลังโหลด...</div>')); renderTopbar(); return; }
    const g = S.game;

    if(g.status==='lobby'){
      const card = el('<div class="card center-text"></div>');
      card.appendChild(el('<h2 style="margin:0 0 6px;">'+esc(g.title)+'</h2>'));
      card.appendChild(el('<p class="muted">สวัสดี '+esc(S.playerName)+' 👋</p>'));
      if(g.scheduledStartAt){
        card.appendChild(el('<p class="muted" style="margin:18px 0 0;">เกมจะเริ่มใน</p>'));
        const countEl = el('<div class="countdown-big"></div>');
        card.appendChild(countEl);
        const hintEl = el('<p class="muted">เตรียมตัวให้พร้อม รอเจ้าของเกมเริ่มเกม</p>');
        card.appendChild(hintEl);
        S.tickTargets = { kind:'lobby', countEl, hintEl, target:g.scheduledStartAt };
        updateTick();
      } else {
        card.appendChild(el('<div style="font-size:40px;margin:18px 0;">⏳</div>'));
        card.appendChild(el('<p class="muted">รอเจ้าของเกมเริ่มเกม...</p>'));
      }
      app.appendChild(card);
    }

    else if(g.status==='question'){
      const q = g.questions[g.currentIndex];
      const {pct, secsLeft} = timerFillStyle(q, g.questionStartedAt);
      const card = el('<div class="card"></div>');
      card.appendChild(el('<div class="qn-tag">คำถามที่ '+(g.currentIndex+1)+' / '+g.questions.length+'</div>'));
      const imgRef = buildQuestionImage(q);
      if(imgRef){ applyImageReveal(imgRef, 1-pct/100); card.appendChild(imgRef.el); }
      card.appendChild(el('<div class="question-text">'+esc(q.text)+'</div>'));
      const timerFillEl = el('<div class="timerbar-fill" style="width:'+pct+'%;"></div>');
      const timerBarEl = el('<div class="timerbar"></div>'); timerBarEl.appendChild(timerFillEl);
      card.appendChild(timerBarEl);
      const secsLabelEl = el('<span>⏱ เหลือ '+secsLeft+' วิ</span>');
      const timerLabelEl = el('<div class="timer-label"></div>'); timerLabelEl.appendChild(secsLabelEl); timerLabelEl.appendChild(el('<span></span>'));
      card.appendChild(timerLabelEl);
      S.tickTargets = { kind:'question', timerFill:timerFillEl, secsLabel:secsLabelEl, imgRef, q, startedAt:g.questionStartedAt };

      if(S.myLastAnswer){
        const grid = el('<div class="answers-grid"></div>');
        q.choices.forEach((c,ci)=>{
          const picked = S.myLastAnswer.choiceIndex===ci;
          grid.appendChild(el('<div class="answer-tile at-'+ci+(picked?' picked':' dim')+'"><div class="shape">'+SHAPES[ci]+'</div><div>'+esc(c)+'</div></div>'));
        });
        card.appendChild(grid);
        card.appendChild(el('<p class="muted center-text" style="margin-top:14px;">✅ ส่งคำตอบแล้ว รอผู้เล่นคนอื่น...</p>'));
      } else {
        const grid = el('<div class="answers-grid"></div>');
        q.choices.forEach((c,ci)=>{
          const tile = document.createElement('button');
          tile.className='answer-tile at-'+ci;
          tile.innerHTML = '<div class="shape">'+SHAPES[ci]+'</div><div>'+esc(c)+'</div>';
          tile.addEventListener('click', ()=>submitAnswer(ci));
          grid.appendChild(tile);
        });
        card.appendChild(grid);
      }
      app.appendChild(card);
    }

    else if(g.status==='reveal'){
      const q = g.questions[g.currentIndex];
      const mine = S.myLastAnswer;
      const card = el('<div class="card"></div>');
      if(mine){
        const good = mine.correct;
        card.appendChild(el('<div class="feedback-badge '+(good?'good':'bad')+'"><div class="big">'+(good?'🎉 ถูกต้อง!':'❌ พลาดไป')+'</div><div class="pts">+'+mine.points+' คะแนน</div></div>'));
      } else {
        card.appendChild(el('<div class="feedback-badge bad"><div class="big">⏱ หมดเวลา</div><div class="pts">ไม่ได้ตอบคำถามนี้</div></div>'));
      }
      card.appendChild(el('<p class="muted">คำตอบที่ถูก: <b style="color:var(--ok);">'+esc(q.choices[q.correctIndex])+'</b></p>'));
      const rows = scoreboard();
      const myRank = rows.findIndex(r=>r.id===S.playerId)+1;
      const myScore = rows.find(r=>r.id===S.playerId);
      card.appendChild(el('<p style="margin-top:14px;">อันดับของคุณ: <b>#'+(myRank||'-')+'</b> · คะแนนรวม <b>'+(myScore?myScore.score:0)+'</b></p>'));
      app.appendChild(card);
      const lbCard = el('<div class="card"></div>');
      lbCard.appendChild(el('<h3 style="margin:0 0 10px;">อันดับคะแนน</h3>'));
      rows.slice(0,8).forEach((r,i)=>{
        const row = el('<div class="lb-row'+(r.id===S.playerId?' me':'')+'"></div>');
        row.appendChild(el('<div class="lb-rank">#'+(i+1)+'</div>'));
        row.appendChild(avatarBadgeEl(r, 28));
        row.appendChild(el('<div class="lb-name">'+esc(r.name)+'</div>'));
        row.appendChild(el('<div class="lb-score">'+r.score+'</div>'));
        lbCard.appendChild(row);
      });
      app.appendChild(lbCard);
      const waitEl = el('<p class="muted center-text" style="margin-top:10px;">รอคำถามต่อไป...</p>');
      app.appendChild(waitEl);
      if(g.autoAdvance){
        const countEl = el('<span></span>');
        waitEl.appendChild(countEl);
        S.tickTargets = { kind:'reveal', countEl, startedAt:g.revealStartedAt };
        updateTick();
      }
    }

    else if(g.status==='ended'){ app.appendChild(renderEndedBlock()); }
    renderTopbar();
  }

  function renderEndedBlock(){
    const wrap = document.createElement('div');
    const rows = scoreboard();
    const card = el('<div class="card center-text"></div>');
    card.appendChild(el('<h2 style="margin:0 0 4px;">🏆 จบเกม!</h2>'));
    card.appendChild(el('<p class="muted" style="margin:0 0 6px;">'+esc(S.game.title)+'</p>'));
    const podium = el('<div class="podium"></div>');
    [1,0,2].forEach(pos=>{
      const r = rows[pos]; if(!r) return;
      const col = el('<div class="podium-col podium-'+(pos+1)+'"></div>');
      col.appendChild(avatarBadgeEl(r, 44));
      col.appendChild(el('<div class="podium-block">#'+(pos+1)+'</div>'));
      col.appendChild(el('<div class="podium-name">'+esc(r.name)+'</div>'));
      col.appendChild(el('<div class="podium-score">'+r.score+' คะแนน</div>'));
      podium.appendChild(col);
    });
    card.appendChild(podium);
    wrap.appendChild(card);

    const lbCard = el('<div class="card" style="margin-top:14px;"></div>');
    lbCard.appendChild(el('<h3 style="margin:0 0 10px;">อันดับทั้งหมด</h3>'));
    rows.forEach((r,i)=>{
      const row = el('<div class="lb-row'+(r.id===S.playerId?' me':'')+'"></div>');
      row.appendChild(el('<div class="lb-rank">#'+(i+1)+'</div>'));
      row.appendChild(avatarBadgeEl(r, 28));
      row.appendChild(el('<div class="lb-name">'+esc(r.name)+'</div>'));
      row.appendChild(el('<div class="lb-score">'+r.score+'</div>'));
      lbCard.appendChild(row);
    });
    wrap.appendChild(lbCard);

    const homeBtn = el('<button class="btn btn-primary btn-block btn-lg" style="margin-top:16px;">🏠 กลับหน้าแรก</button>');
    homeBtn.addEventListener('click', goHome);
    wrap.appendChild(homeBtn);
    return wrap;
  }

  // ================= HOME =================
  function renderHome(){
    const app = document.getElementById('app'); app.innerHTML='';
    const col = el('<div class="center-col"></div>');
    col.appendChild(el('<div><div class="hero-title">Quiz <span class="accent-text">Arena</span></div><p class="hero-sub">สร้างห้องควิซของคุณเอง แชร์รหัสให้เพื่อน แล้วแข่งตอบคำถามสดพร้อมกันได้เลย ไม่ต้องมีบัญชีใดๆ</p></div>'));

    if(S.dbState==='unavailable'){
      col.appendChild(el('<div class="warn-banner">ยังไม่ได้ตั้งค่า Firebase — แก้ไฟล์ firebase-config.js ให้ใส่ค่าโปรเจกต์ Firebase ของคุณก่อนใช้งาน</div>'));
    }

    const choices = el('<div class="home-choices"></div>');
    const hostCard = el('<div class="choice-card"><span class="emoji">🎮</span><div><b>เป็นเจ้าของเกม</b><span>สร้างคำถามและควบคุมเกม</span></div></div>');
    hostCard.addEventListener('click', ()=>{ S.screen='host-setup'; render(); });
    const joinCard = el('<div class="choice-card"><span class="emoji">📱</span><div><b>เข้าร่วมเกม</b><span>ใส่รหัสห้องเพื่อเล่น</span></div></div>');
    joinCard.addEventListener('click', ()=>{ S.screen='join'; render(); });
    choices.appendChild(hostCard); choices.appendChild(joinCard);
    col.appendChild(choices);

    app.appendChild(col);
    app.appendChild(el('<div class="footer-note">Quiz Arena · เล่นฟรี ไม่ต้องล็อกอิน</div>'));
    renderTopbar();
  }

  // ================= MASTER RENDER =================
  function render(){
    switch(S.screen){
      case 'home': renderHome(); break;
      case 'host-setup': renderHostSetup(); break;
      case 'host-play': renderHostPlay(); break;
      case 'join': renderJoin(); break;
      case 'player-play': renderPlayerPlay(); break;
      default: renderHome();
    }
  }

  render();
  initDb();
})();
</script>
</body>
</html>
